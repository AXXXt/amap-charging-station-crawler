# Add these locations INSIDE the existing station-dashboard server block.
# Keep its listen/server_name/TLS/root and ALL existing EVCS/report routes.
# In particular, keep the existing "location /api/" -> 127.0.0.1:8088 unchanged.
# Keep the existing "location /" SPA fallback; this exact root match wins over it.
# Merge only conflicting locations below; do not add duplicate location definitions.

location = / {
    absolute_redirect off;
    return 302 /station-dashboard$is_args$args;
}

location = /collector-monitor {
    absolute_redirect off;
    return 302 /station-dashboard$is_args$args;
}

location = /station-dashboard/ {
    absolute_redirect off;
    return 302 /station-dashboard$is_args$args;
}

location = /station-dashboard {
    proxy_pass http://127.0.0.1:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /station-dashboard/ {
    proxy_pass http://127.0.0.1:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /collector-monitor/ {
    proxy_pass http://127.0.0.1:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/collector-monitor {
    proxy_read_timeout 45s;
    proxy_pass http://127.0.0.1:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# This prefix is more specific than the existing /api/ route.
# Includes per-device commands, stop-all and phone recovery telemetry.
location ^~ /api/v1/collector-monitor/ {
    proxy_read_timeout 45s;
    proxy_pass http://127.0.0.1:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No replacement "location /" or "location /api/" belongs in this snippet.
# After merging: nginx -t, then reload nginx. Do not restart station-dashboard.
